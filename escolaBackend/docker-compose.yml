version: '3.8'

services:
  api:
    build: .
    container_name: apirest_node
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - DATABASE_HOST=db
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: apirest_db
    restart: always
    environment:
      MYSQL_DATABASE: escola
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
